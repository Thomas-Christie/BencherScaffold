syntax = "proto3";

service Bencher {
  rpc evaluate_point(BenchmarkRequest) returns (EvaluationResult){};
}

enum BenchmarkType {
  PURELY_CONTINUOUS = 0;
  PURELY_BINARY = 1;
  PURELY_CATEGORICAL = 2;
  PURELY_ORDINAL_REAL = 3;
  PURELY_ORDINAL_INT = 4;
  MIXED = 5;
}

enum ValueType {
  CONTINUOUS = 0;
  BINARY = 1;
  INTEGER = 2;
  CATEGORICAL = 3;
}

message Value {
  ValueType type = 1;
  double value = 2;
}

message Benchmark {
  string name = 1;
  BenchmarkType type = 2;
  string description = 3;
}

// a benchmark request contains a point and the name of the benchmark
message BenchmarkRequest {
  Benchmark benchmark = 1;
  Point point = 2;
}

// a point is a list of doubles
message Point {
  repeated Value values = 1;
}

enum ConstraintType {
  INEQUALITY = 0;
  EQUALITY = 1;
}

message Constraint {
  string name = 1;
  ConstraintType type = 2;
  double value = 3;
}

// a named objective value
message ObjectiveValue {
  string name = 1;
  double value = 2;
}

// an evaluation result carries one entry per objective, which is what allows
// multi-objective optimization, plus one entry per constraint
message EvaluationResult {
  repeated ObjectiveValue objectives = 1;
  repeated Constraint constraints = 2;
}